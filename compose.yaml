services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cloud_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/lab_db_password
    secrets:
      - lab_db_password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - cloud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: cloud-application:0.4
    command: alembic upgrade head
    environment:
      DB_HOST: db
    secrets:
      - lab_db_password
      - auth_secret
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/app/migrations
    networks:
      - cloud-network

  app:
    image: cloud-application:0.4
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8080:8000"
    environment:
      DB_HOST: db
      NOTIFICATION_SERVICE_URL: "http://notification:9000"
    secrets:
      - lab_db_password
      - auth_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - cloud-network

  notification:
    image: cloud-application:0.4
    command: uvicorn app.notification_service.main:app --host 0.0.0.0 --port 9000
    networks:
      - cloud-network

volumes:
  postgres_data:

networks:
  cloud-network:
    driver: bridge

secrets:
  lab_db_password:
    file: ./secrets/lab_db_password
  auth_secret:
    file: ./secrets/auth_secret